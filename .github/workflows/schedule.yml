name: Daily Scraper Cron

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Acerinox Scraper
        env:
          HEGO_USER: ${{ secrets.HEGO_USER }}
          HEGO_PASS: ${{ secrets.HEGO_PASS }}
        run: node scrape.js

      - name: Reconstruct Microsoft Session
        run: |
          echo '${{ secrets.MICROSOFT_SESSION }}' > auth_state.json

      - name: Execute Arvedi AST Scraper
        continue-on-error: true
        run: node scrape_site3.js

      - name: Execute Outokumpu Scraper
        env:
         OUTOKUMPU_USER: ${{ secrets.OUTOKUMPU_USER }}
         OUTOKUMPU_PASS: ${{ secrets.OUTOKUMPU_PASS }}
       run: node scrape_site4.js

      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
           name: debug-files
           path: |
             debug.png
             page.html

      - name: Commit and Push All Excel Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git commit -m "chore: update daily scraped data" || echo "No changes to commit"
          git push
