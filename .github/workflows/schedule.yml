name: Daily Scraper Cron

on:
  schedule:
    - cron: '0 7 * * 1-5' # 7:00 AM UTC = 9:00 AM Netherlands Summer Time (Mon-Fri)
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # 1. OUTOKUMPU GOES FIRST (The Boss / Gatekeeper)
      - name: Execute Outokumpu Scraper
        env:
          OUTOKUMPU_USER: ${{ secrets.OUTOKUMPU_USER }}
          OUTOKUMPU_PASS: ${{ secrets.OUTOKUMPU_PASS }}
        run: node scrape_site4.js

      # 2. ACERINOX RUNS SECOND
      - name: Execute Acerinox Scraper
        env:
          HEGO_USER: ${{ secrets.HEGO_USER }}
          HEGO_PASS: ${{ secrets.HEGO_PASS }}
        run: node scrape.js

      # 3. ARVEDI RUNS LAST
      - name: Reconstruct Microsoft Session
        run: |
          echo '${{ secrets.MICROSOFT_SESSION }}' > auth_state.json

      - name: Execute Arvedi AST Scraper
        continue-on-error: true
        run: node scrape_site3.js

      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          if-no-files-found: ignore
          path: |
            *.png
            page.html

      - name: Commit and Push All Excel Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update daily scraped data" || echo "No changes to commit"
          git push

      - name: Send files to Retool Workflow
        run: |
          echo "Encoding Excel files..."

          ACERINOX_B64=$(base64 -w 0 scraped_data.xlsx)
          OUTOKUMPU_B64=$(base64 -w 0 outokumpu_data.xlsx)
          TERNI_B64=$(base64 -w 0 arvedi_data.xlsx)

          echo "Creating JSON payload..."

          cat > payload.json <<EOF
          {
            "acerinox_file": "$ACERINOX_B64",
            "outokumpu_file": "$OUTOKUMPU_B64",
            "terni_file": "$TERNI_B64"
          }
          EOF

          echo "Sending payload to Retool..."

          curl \
            --fail \
            --show-error \
            --silent \
            -X POST "${{ secrets.RETOOL_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Workflow-Api-Key: ${{ secrets.RETOOL_API_KEY }}" \
            --data @payload.json

          echo "Retool workflow triggered successfully."
