name: Daily Scraper Cron

on:
  schedule:
    - cron: '0 7 * * *' # 7:00 AM UTC = 9:00 AM Netherlands Time
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # 1. OUTOKUMPU GOES FIRST (The Gatekeeper)
      # Notice we removed "continue-on-error: true" so if it fails/times out, everything stops.
      - name: Execute Outokumpu Scraper
        env:
          OUTOKUMPU_USER: ${{ secrets.OUTOKUMPU_USER }}
          OUTOKUMPU_PASS: ${{ secrets.OUTOKUMPU_PASS }}
        run: node scrape_site4.js

      # 2. ACERINOX RUNS SECOND
      - name: Execute Acerinox Scraper
        env:
          HEGO_USER: ${{ secrets.HEGO_USER }}
          HEGO_PASS: ${{ secrets.HEGO_PASS }}
        run: node scrape.js

      # 3. ARVEDI RUNS LAST
      - name: Reconstruct Microsoft Session
        run: |
          echo '${{ secrets.MICROSOFT_SESSION }}' > auth_state.json

      - name: Execute Arvedi AST Scraper
        continue-on-error: true
        run: node scrape_site3.js

      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          if-no-files-found: ignore
          path: |
            *.png
            page.html

      - name: Commit and Push All Excel Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update daily scraped data" || echo "No changes to commit"
          git push
