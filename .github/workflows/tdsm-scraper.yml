name: TDSM Portal Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup isolated scraper dependencies
        working-directory: tdsm-scraper
        run: |
          # Copy custom package to subfolder package.json so Node detects type: module
          cp tdsm_package.json package.json
          npm install

      - name: Install Playwright browsers & OS dependencies
        working-directory: tdsm-scraper
        run: |
          # Run install directly from the local node_modules binary
          npx playwright install chromium --with-deps

      - name: Run Scraper
        working-directory: tdsm-scraper
        env:
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
        run: node tdsm_extractor.js

      - name: Upload Step Screenshots (Debug Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-flow-screenshots
          path: tdsm-scraper/screenshots/
          retention-days: 7

      - name: Upload Compiled Student PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-packets
          path: tdsm-scraper/output/
          retention-days: 30
