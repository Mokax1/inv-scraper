name: TDSM Portal Scraper

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Report start date (YYYY-MM-DD). Leave empty for the last 7 days.'
        required: false
        default: ''
      end_date:
        description: 'Report end date (YYYY-MM-DD). Leave empty for the last 7 days.'
        required: false
        default: ''
      database:
        description: 'Database / location to scrape (Charleston, Columbia, Greenville, Myrtle, RockHill). Leave empty to keep the portal default.'
        required: false
        default: ''
      mark_completed:
        description: 'Set each student to Completed after the packet is built (on / off).'
        required: false
        default: 'on'

permissions:
  contents: read
  checks: write   # lets the scraper post live progress for the desktop app

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup isolated scraper dependencies
        working-directory: tdsm-scraper
        run: |
          cp tdsm_package.json package.json
          npm install

      - name: Install Playwright browsers & OS dependencies
        working-directory: tdsm-scraper
        run: |
          npx playwright install chromium --with-deps

      - name: Run Scraper
        working-directory: tdsm-scraper
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          DATABASE: ${{ inputs.database }}
          MARK_COMPLETED: ${{ inputs.mark_completed }}
        run: node tdsm_extractor.js

      - name: Upload Step Screenshots (Debug Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-flow-screenshots
          path: tdsm-scraper/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Compiled Student PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-packets
          path: tdsm-scraper/output/
          if-no-files-found: ignore
          retention-days: 30
